name: Build Cloudflare Worker bundle

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd cloudflare/worker && npm install
      - run: cd cloudflare/worker && npm run build
      - name: Commit bundle
        run: |
          if git log -1 --pretty=%B | grep -q '\[bundle\]'; then
            echo "Bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker/dist/index.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
            exit 0
          fi
          git commit -m "Build Cloudflare Worker bundle [bundle]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
