name: Cloudflare Worker CI
on:
  push:
    paths:
      - "cloudflare/worker/**"
  pull_request:
    paths:
      - "cloudflare/worker/**"
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
